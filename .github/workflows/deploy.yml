name: Deploy Gallery to GitHub Pages

on:
  push:
    paths:
      - 'galleries/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p _site

      - name: Convert Markdown to HTML Galleries
        run: |
          echo "Starting conversion..."
          echo "Looking for markdown files in galleries/"
          ls -la galleries/
          
          for markdown_file in galleries/*.md; do
            if [ -f "$markdown_file" ]; then
              filename=$(basename "$markdown_file" .md)
              output_file="_site/${filename}.html"
              echo "Converting $markdown_file → $output_file"
              python3 .github/workflows/convert.py "$markdown_file" "$output_file" "$filename"
            fi
          done
          
          echo "Files created:"
          ls -lah _site/

      - name: Create index page
        run: |
          cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Galleries</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { margin: 1rem 0; }
        a { color: #0066cc; text-decoration: none; font-size: 1.1rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>📸 Image Galleries</h1>
    <ul>
EOF
          
          for markdown_file in galleries/*.md; do
            if [ -f "$markdown_file" ]; then
              filename=$(basename "$markdown_file" .md)
              title=$(echo "$filename" | sed 's/-/ /g')
              echo "      <li><a href=\"${filename}.html\">→ $title</a></li>" >> _site/index.html
            fi
          done
          
          cat >> _site/index.html << 'EOF'
    </ul>
</body>
</html>
EOF
          
          echo "Final _site/ contents:"
          ls -lah _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

name: Markdown to Image Gallery

on:
  push:
    paths:
      - 'galleries/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Convert Markdown to HTML Galleries
        run: |
          for markdown_file in galleries/*.md; do
            if [ -f "$markdown_file" ]; then
              filename=$(basename "$markdown_file" .md)
              output_file="${filename}.html"
              python3 .github/workflows/convert.py "$markdown_file" "$output_file" "$filename"
            fi
          done

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generate gallery HTML files" && git push)
        continue-on-error: true
